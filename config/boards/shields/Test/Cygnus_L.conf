CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- Split-link responsiveness (this half is the BLE peripheral of the split) ---
# Left key events must travel over BLE to the right (central) before hold-tap /
# layer-tap is resolved. On defaults the split link uses a wide interval + slave
# latency, so left-hand hold-taps feel laggy. Pin the interval to 7.5 ms and drop
# slave latency so events reach the central immediately (matches the right<->host
# tuning in Cygnus_R.conf; slightly higher idle power draw).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=100
